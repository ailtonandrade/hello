<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamSaver - Select Stream</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 500px;
        }
        header {
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 2rem;
            color: #333;
        }
        header p {
            font-size: 1rem;
            color: #666;
        }
        select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
        .flash {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .flash.success {
            background-color: #d4edda;
            color: #155724;
        }
        .flash.error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>StreamSaver</h1>
            <p>Select the stream you want to download.</p>
        </header>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}
        <form method="POST">
            <select name="itag">
                <optgroup label="Video Streams">
                    {% for stream in streams %}
                        <option value="{{ stream.itag }}">{{ stream.resolution }} (Video)</option>
                    {% endfor %}
                </optgroup>
                <optgroup label="Audio Streams">
                    {% for stream in audio_streams %}
                        <option value="{{ stream.itag }}">Audio Only</option>
                    {% endfor %}
                </optgroup>
            </select>
            <button type="submit">Download</button>
        </form>
    </div>
</body>
</html>
