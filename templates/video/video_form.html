<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Vídeos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Small complement to Tailwind for consistent font-family and a subtle page gradient */
        :root{--bg-start:#06111a; --bg-end:#081224}
        html,body{height:100%}
        body{font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; margin:0; padding:0; background:linear-gradient(180deg,var(--bg-start) 0%, var(--bg-end) 100%); color:#e6eef6}
        /* Focus ring consistent color */
        .focus-ring:focus{outline:2px solid rgba(124,92,255,0.18); outline-offset:2px}
    </style>
</head>
<body>
    <div class="max-w-3xl mx-auto px-4 py-8">
        <div class="bg-slate-900/60 backdrop-blur-lg rounded-2xl shadow-2xl overflow-hidden border border-slate-800">
            <header class="flex items-center justify-between p-5 bg-gradient-to-r from-violet-700 to-indigo-500">
                <div class="flex items-center gap-3">
                    <button type="button" onclick="history.back()" class="mr-2 p-2 rounded-md bg-emerald-400 text-slate-900 hover:opacity-90 shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <div class="p-2 rounded-md bg-white/10">
                        <svg class="w-7 h-7 text-emerald-300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 2v6M5 6l7 6 7-6"/></svg>
                    </div>
                    <div>
                        <h3 class="text-slate-50 font-bold text-lg">Gerador de Vídeos</h3>
                        <p class="text-slate-300 text-sm">Preencha os campos e gere o vídeo — rápido e limpo</p>
                    </div>
                </div>
            </header>

            <div class="p-6 space-y-6">
                <form id="genForm">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="text-slate-300 text-sm font-semibold flex items-center gap-2"><svg class="w-4 h-4 text-emerald-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2-2 4 4M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><span>Velocidade da Voz</span></label>
                            <div class="mt-2 flex items-center gap-3">
                                <input id="voice_speed_range" type="range" min="0.5" max="2" step="0.05" value="1.1" class="w-full" style="accent-color:#34D399" aria-label="Velocidade da Voz">
                                <div class="w-16 text-right text-slate-200 font-mono" id="voice_speed_display">1.10</div>
                                <input type="hidden" id="voice_speed" name="voice_speed" value="1.1">
                            </div>
                        </div>

                        <div class="col-span-2">
                            <label class="text-slate-300 text-sm font-semibold flex items-center gap-2"><svg class="w-4 h-4 text-emerald-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 5L6 9H2v6h4l5 4V5z M19 8a4 4 0 010 8"/></svg><span>Volume</span></label>
                            <div class="mt-2 flex items-center gap-3">
                                <input id="voice_volume_range" type="range" min="0.1" max="2" step="0.1" value="1.2" class="w-full" style="accent-color:#34D399"/>
                                <div class="w-20 text-right text-slate-200 font-mono" id="voice_volume_display">1.2</div>
                                <input type="hidden" id="voice_volume" name="voice_volume" value="1.2">
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="text-slate-300 text-sm font-semibold flex items-center gap-2"><svg class="w-4 h-4 text-emerald-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 5v14M5 12h14"/></svg><span>Prompt Positive</span></label>
                            <textarea id="prompt_positive" name="prompt_positive" rows="3" class="mt-2 w-full bg-slate-800 text-slate-100 rounded-md px-3 py-2"></textarea>
                        </div>
                        <div>
                            <label class="text-slate-300 text-sm font-semibold flex items-center gap-2"><svg class="w-4 h-4 text-emerald-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 12H5"/></svg><span>Prompt Negative</span></label>
                            <textarea id="prompt_negative" name="prompt_negative" rows="3" class="mt-2 w-full bg-slate-800 text-slate-100 rounded-md px-3 py-2"></textarea>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="text-slate-300 text-sm font-semibold flex items-center gap-2"><svg class="w-4 h-4 text-emerald-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 11c1.657 0 3-1.567 3-3.5S13.657 4 12 4 9 5.567 9 7.5 10.343 11 12 11zM5 20v-2a4 4 0 014-4h6"/></svg><span>Chave de Prompt</span></label>
                            <select id="prompt_key" name="prompt_key" class="mt-2 w-full bg-slate-800 text-slate-100 rounded-md px-3 py-2">
                                <option value="">— selecione —</option>
                                {% for pk in prompt_keys %}
                                    <option value="{{ pk.id }}">{{ pk.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="text-slate-300 text-sm font-semibold flex items-center gap-2"><svg class="w-4 h-4 text-emerald-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14V7H3zM7 3v4"/></svg><span>Template</span></label>
                            <select id="template_select" name="template_id" class="mt-2 w-full bg-slate-800 text-slate-100 rounded-md px-3 py-2">
                                <option value="">— selecione —</option>
                                {% for t in templates %}
                                    <option value="{{ t.id }}">{{ t.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="text-slate-300 text-sm font-semibold flex items-center gap-2"><svg class="w-4 h-4 text-emerald-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 1v22M4 7h4v10H4zM16 7h4v10h-4z"/></svg><span>Voz</span></label>
                            <select id="voice_name" name="voice_name" class="mt-2 w-full bg-slate-800 text-slate-100 rounded-md px-3 py-2 focus-ring">
                                <option value="Thom">Thom</option>
                            </select>
                        </div>
                    </div>

                    <input type="hidden" id="subtitle_words_per_line" name="subtitle_words_per_line" value="{{ config.SUBTITLE_WORDS_PER_LINE if config and config.SUBTITLE_WORDS_PER_LINE is defined else 3 }}">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                        <div>
                            <label class="text-slate-300 text-sm font-semibold flex items-center gap-2"><svg class="w-4 h-4 text-emerald-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 3h12M6 21h12M12 3v18"/></svg><span>Tamanho da Fonte da Legenda</span></label>
                            <input type="number" class="mt-2 w-full bg-slate-800 text-slate-100 rounded-md px-3 py-2 focus-ring" id="subtitle_font_size" name="subtitle_font_size" value="55" required>
                        </div>
                        <div>
                            <label class="text-slate-300 text-sm font-semibold flex items-center gap-2"><svg class="w-4 h-4 text-emerald-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14V5H5a2 2 0 00-2 2z"/></svg><span>Orientação da Tela</span></label>
                            <div class="mt-2 flex gap-2">
                                <button type="button" class="orientation-btn px-3 py-2 rounded-md bg-slate-800 text-slate-200 active" data-value="MOBILE" title="Mobile">📱 Mobile</button>
                                <button type="button" class="orientation-btn px-3 py-2 rounded-md bg-slate-800 text-slate-200" data-value="DESKTOP" title="Desktop">🖥️ Desktop</button>
                                <input type="hidden" name="screen_orientation" id="screen_orientation" value="MOBILE">
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                        <div>
                            <label class="text-slate-300 text-sm font-semibold flex items-center gap-2"><svg class="w-4 h-4 text-emerald-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h10M4 18h16"/></svg><span>Fonte da Legenda</span></label>
                            <select id="subtitle_font_select" class="mt-2 w-full bg-slate-800 text-slate-100 rounded-md px-3 py-2">
                                <option value="Lilita" selected>Lilita</option>
                                <option value="Inter">Inter</option>
                                <option value="Roboto">Roboto</option>
                            </select>
                            <input type="hidden" name="subtitle_font" id="subtitle_font" value="Lilita.ttf">
                        </div>
                        <div>
                            <label class="text-slate-300 text-sm font-semibold flex items-center gap-2"><svg class="w-4 h-4 text-emerald-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 2l4 7-4 7-4-7 4-7z"/></svg><span>Cor da Fonte da Legenda (RGBA)</span></label>
                            <div class="mt-2 flex items-center gap-3">
                                <input type="color" id="subtitle_color_picker" value="#ffbf00" class="w-14 h-10 p-1 rounded-md">
                                <div class="flex flex-col">
                                    <label class="text-slate-400 text-xs">Alpha</label>
                                    <input id="subtitle_alpha" type="range" min="0" max="255" step="1" value="200" class="w-48 text-emerald-400" style="accent-color:#34D399">
                                </div>
                                <div>
                                    <div class="text-xs text-slate-400">Preview</div>
                                    <div id="subtitle_color_preview" class="w-9 h-6 rounded-sm border border-slate-700" style="background:rgba(255,191,0,0.78)"></div>
                                </div>
                            </div>
                            <input type="hidden" name="subtitle_font_color_r" id="subtitle_font_color_r" value="255">
                            <input type="hidden" name="subtitle_font_color_g" id="subtitle_font_color_g" value="191">
                            <input type="hidden" name="subtitle_font_color_b" id="subtitle_font_color_b" value="0">
                            <input type="hidden" name="subtitle_font_color_a" id="subtitle_font_color_a" value="200">
                        </div>
                    </div>

                    <div class="mt-4">
                        <label class="text-slate-300 text-sm font-semibold">Texto Narração</label>
                        <textarea class="mt-2 w-full bg-slate-800 text-slate-100 rounded-md px-3 py-2" id="force_text" name="force_text" rows="4" maxlength="200" placeholder="Se preenchido, será usado como texto da narração"></textarea>
                        <div class="mt-2 text-slate-400 text-xs text-right" id="force_text_counter">0/200</div>
                    </div>

                    <div class="mt-6 flex flex-col md:flex-row items-center gap-4">
                        <div class="flex-1">
                            <div class="w-full relative bg-slate-800 rounded-full h-3 overflow-hidden">
                                <div id="progressBar" class="h-3 bg-gradient-to-r from-emerald-400 to-cyan-400" style="width:0%"></div>
                                <div id="progressPct" class="absolute inset-0 flex items-center justify-center text-xs font-mono text-slate-100">0%</div>
                            </div>
                            <div class="mt-2 text-slate-300 text-sm">
                                <div id="progressMessage"></div>
                            </div>
                        </div>
                        <div class="w-full md:w-48">
                            <button id="generateBtn" type="button" class="w-full py-3 bg-emerald-400 hover:bg-emerald-500 active:scale-95 transform-gpu text-slate-900 font-semibold rounded-lg shadow-lg flex items-center justify-center gap-2">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-6.518-3.76A1 1 0 007 8.324v7.352a1 1 0 001.234.97l6.518-1.88a1 1 0 00.75-.97v-1.866a1 1 0 00-.75-.862z"></path></svg>
                                <span id="generateLabel">Gerar Vídeo</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
            // Load prompt key or template and populate form
            async function loadPromptKey(pkId) {
                if (!pkId) return;
                try {
                    const res = await fetch('/api/prompt_key/' + pkId);
                    if (!res.ok) return;
                    const j = await res.json();
                    document.getElementById('prompt_ollama').value = j.prompt_ollama || '';
                    document.getElementById('prompt_positive').value = j.prompt_positive || '';
                    document.getElementById('prompt_negative').value = j.prompt_negative || '';
                } catch (e) { console.error(e); }
            }

            async function loadTemplate(tid) {
                if (!tid) return;
                try {
                    const res = await fetch('/api/template/' + tid);
                    if (!res.ok) return;
                    const j = await res.json();
                    const data = j.data || {};
                    if (data.prompt_ollama) document.getElementById('prompt_ollama').value = data.prompt_ollama;
                    if (data.prompt_positive) document.getElementById('prompt_positive').value = data.prompt_positive;
                    if (data.prompt_negative) document.getElementById('prompt_negative').value = data.prompt_negative;
                    if (data.channel) document.getElementById('channel') && (document.getElementById('channel').value = data.channel);
                    if (data.theme) document.getElementById('theme') && (document.getElementById('theme').value = data.theme);
                    if (data.voice_name) document.getElementById('voice_name') && (document.getElementById('voice_name').value = data.voice_name);
                    if (data.voice_speed) document.getElementById('voice_speed') && (document.getElementById('voice_speed').value = data.voice_speed);
                } catch (e) { console.error(e); }
            }

            document.getElementById('prompt_key')?.addEventListener('change', (e) => {
                const v = e.target.value;
                if (!v) return;
                loadPromptKey(v);
            });

            document.getElementById('template_select')?.addEventListener('change', (e) => {
                const v = e.target.value;
                if (!v) return;
                loadTemplate(v);
            });

            // orientation buttons — toggle visual selected state using Tailwind classes
            function setOrientationActive(btn){
                document.querySelectorAll('.orientation-btn').forEach(b => {
                    b.classList.remove('bg-emerald-400','text-slate-900','shadow-md');
                    b.classList.remove('ring-2','ring-emerald-300');
                    b.classList.add('bg-slate-800','text-slate-200');
                });
                btn.classList.remove('bg-slate-800','text-slate-200');
                btn.classList.add('bg-emerald-400','text-slate-900','shadow-md');
            }

            document.querySelectorAll('.orientation-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    setOrientationActive(btn);
                    const val = btn.getAttribute('data-value') || 'MOBILE';
                    const hidden = document.getElementById('screen_orientation');
                    if (hidden) hidden.value = val;
                });
            });
            // initialize active visual state
            const initialOrient = document.querySelector('.orientation-btn[data-value="MOBILE"]');
            if(initialOrient) setOrientationActive(initialOrient);

            // subtitle font select -> hidden input (.ttf appended server-side expects .ttf)
            const ssel = document.getElementById('subtitle_font_select');
            ssel?.addEventListener('change', (e) => {
                const v = e.target.value || 'Lilita';
                const hidden = document.getElementById('subtitle_font');
                if (hidden) hidden.value = v + '.ttf';
            });

            // Poll /status e atualiza a barra de progresso (exibe % e mensagem)
            function pollStatus() {
                fetch('/status')
                    .then(r => r.json())
                    .then(data => {
                        const p = Math.max(0, Math.min(100, Number(data.progress || 0)));
                        const bar = document.getElementById('progressBar');
                        const pct = document.getElementById('progressPct');
                        const msg = document.getElementById('progressMessage');
                        if (bar) { bar.style.width = p + '%'; }
                        if (pct) pct.textContent = p + '%';

                        // mostrar "Pronto" somente quando finalizado
                        const messageLower = (data.message || '').toLowerCase();
                        const finished = p >= 100 || messageLower.includes('finished') || messageLower.includes('conclu') || messageLower.includes('pronto') || messageLower.includes('done');
                        if (msg) msg.textContent = finished ? 'Pronto' : '';

                        const genBtn = document.getElementById('generateBtn');
                        if (genBtn) {
                            if (!finished && (p === 0 || p < 95) && !messageLower.includes('cancel')) {
                                // still running or idle - keep label state
                            } else {
                                // finalize button when finished or cancelled/high progress
                                genBtn.textContent = 'Gerar Vídeo';
                                genBtn.dataset.running = 'false';
                            }
                        }
                    })
                    .catch(() => {});
            }

            setInterval(pollStatus, 2000);
            pollStatus();

            // Handle generate/stop toggle
            const genForm = document.getElementById('genForm');
            const genBtn = document.getElementById('generateBtn');
            genBtn.dataset.running = 'false';

            genBtn.addEventListener('click', (e) => {
                const running = genBtn.dataset.running === 'true';
                if (!running) {
                    // start generation via fetch
                    const form = genForm;
                    const formData = new FormData(form);
                    fetch('/generate', { method: 'POST', body: formData })
                        .then(() => {
                            genBtn.textContent = 'Interromper Geração';
                            genBtn.dataset.running = 'true';
                        })
                        .catch(err => {
                            console.error(err);
                            alert('Falha ao iniciar geração');
                        });
                } else {
                    // send stop
                    fetch('/stop', { method: 'POST' })
                        .then(r => r.json())
                        .then(j => {
                            if (j.stopped) {
                                genBtn.textContent = 'Gerar Vídeo';
                                genBtn.dataset.running = 'false';
                            } else {
                                alert('Não existe geração ativa');
                            }
                        });
                }
            });

            // volume range sync (single range) -> update hidden input and display
            const volRange = document.getElementById('voice_volume_range');
            const volHidden = document.getElementById('voice_volume');
            const volDisplay = document.getElementById('voice_volume_display');
            if (volRange) {
                const initV = Number(volRange.value).toFixed(1);
                if (volHidden) volHidden.value = initV;
                if (volDisplay) volDisplay.textContent = initV;
                volRange.addEventListener('input', (e) => {
                    const v = Number(e.target.value).toFixed(1);
                    if (volHidden) volHidden.value = v;
                    if (volDisplay) volDisplay.textContent = v;
                });
            }

            // voice speed range sync (mirrors volume control behavior)
            const speedRange = document.getElementById('voice_speed_range');
            const speedHidden = document.getElementById('voice_speed');
            const speedDisplay = document.getElementById('voice_speed_display');
                if(speedRange){
                    // init display
                    const initV = Number(speedRange.value).toFixed(2);
                    if(speedHidden) speedHidden.value = initV;
                    if(speedDisplay) speedDisplay.textContent = initV;
                    speedRange.addEventListener('input', (e)=>{
                        const v = Number(e.target.value).toFixed(2);
                        if(speedHidden) speedHidden.value = v;
                        if(speedDisplay) speedDisplay.textContent = v;
                    });
                }

            // color picker sync -> update hidden RGBA inputs
            function hexToRgb(hex) {
                const m = hex.replace('#','');
                const bigint = parseInt(m, 16);
                const r = (bigint >> 16) & 255;
                const g = (bigint >> 8) & 255;
                const b = bigint & 255;
                return [r,g,b];
            }

            const colorPicker = document.getElementById('subtitle_color_picker');
            const alphaSlider = document.getElementById('subtitle_alpha');
            const preview = document.getElementById('subtitle_color_preview');
            const rIn = document.getElementById('subtitle_font_color_r');
            const gIn = document.getElementById('subtitle_font_color_g');
            const bIn = document.getElementById('subtitle_font_color_b');
            const aIn = document.getElementById('subtitle_font_color_a');

            function updateColorFromPicker(){
                if(!colorPicker) return;
                const hex = colorPicker.value || '#ffbf00';
                const [r,g,b] = hexToRgb(hex);
                const a = alphaSlider ? Number(alphaSlider.value) : 255;
                if(rIn) rIn.value = r;
                if(gIn) gIn.value = g;
                if(bIn) bIn.value = b;
                if(aIn) aIn.value = a;
                if(preview) preview.style.background = `rgba(${r}, ${g}, ${b}, ${a/255})`;
            }

            colorPicker?.addEventListener('input', updateColorFromPicker);
            alphaSlider?.addEventListener('input', updateColorFromPicker);
            // init
            updateColorFromPicker();

            // (subtitle font select handler defined earlier)

            // force_text char limit and counter (200 chars)
            const forceText = document.getElementById('force_text');
            const forceCounter = document.getElementById('force_text_counter');
            if (forceText && forceCounter) {
                const MAX = 200;
                forceCounter.textContent = (forceText.value || '').length + '/' + MAX;
                forceText.addEventListener('input', (e) => {
                    if (forceText.value.length > MAX) {
                        forceText.value = forceText.value.substring(0, MAX);
                    }
                    forceCounter.textContent = forceText.value.length + '/' + MAX;
                });
            }

        // Dark mode enforced by CSS variables in :root
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
