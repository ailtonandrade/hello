<div id="infoModal" class="fixed inset-0 flex items-end sm:items-center justify-center p-4 z-50 hidden">
  <div class="fixed inset-0 bg-black/50 backdrop-blur-sm" onclick="hideModal()"></div>
  <div class="bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg shadow-lg max-w-lg w-full p-4 z-50">
    <div class="flex items-start gap-3">
      <div id="modalIcon" class="text-emerald-400">ℹ️</div>
      <div class="flex-1">
        <div id="modalTitle" class="font-semibold text-lg">Info</div>
        <div id="modalBody" class="text-sm text-slate-600 dark:text-slate-300 mt-2"></div>
      </div>
      <button class="text-slate-500 hover:text-slate-700" onclick="hideModal()">✕</button>
    </div>
  </div>
</div>
<script>
function showModal(title, message, icon){
  document.getElementById('modalTitle').textContent = title || 'Info';
  document.getElementById('modalBody').innerHTML = message || '';
  if(icon) document.getElementById('modalIcon').innerHTML = icon;
  document.getElementById('infoModal').classList.remove('hidden');
}
function hideModal(){
  document.getElementById('infoModal').classList.add('hidden');
}
</script>
