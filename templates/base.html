<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Otom — AI Media{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    html,body{height:100%}
    body{font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial; margin:0; padding:0; background:linear-gradient(180deg,#06111a 0%, #081224 100%); color:#e6eef6}
  </style>
  {% block head_extras %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col bg-slate-900 text-slate-100">
  <div class="flex-1 flex flex-col md:flex-row">
    {% include 'partials/_sidebar.html' %}
    <main class="flex-1 p-8 md:ml-72">
      <!-- Unified content container: keeps the same max width on all pages so the
           sidebar remains the primary frame and pages are its children. Change
           `max-w-3xl` to a different Tailwind max-w-* value if you prefer a
           wider layout. -->
      <div class="w-full">
        <div class="max-w-3xl mx-auto w-full">
          {% block content %}{% endblock %}
        </div>
      </div>
    </main>
  </div>
  {% include 'partials/_footer.html' %}
  {% block scripts %}{% endblock %}
</body>
</html>
