<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Vídeos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#0f1724;
            --card:#071026;
            --muted:#9aa4b2;
            --accent:#6ee7b7;
            --primary:#7c5cff;
            --glass: rgba(255,255,255,0.03);
        }
        html,body{height:100%;}
        body{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; margin:0; padding:28px; background: linear-gradient(180deg,#06111a 0%, var(--bg) 100%); color:#e6eef6}
        .container{max-width:880px}
        .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.04)); border:1px solid rgba(255,255,255,0.03); box-shadow:0 10px 30px rgba(2,6,23,0.6); border-radius:12px}
        .card-header{background:linear-gradient(90deg,var(--primary),#9b8bff); border-radius:12px 12px 0 0; color:#071021}
        .card-title{font-weight:700}
        .form-label{color:var(--muted)}
        .form-control, .form-select{background:#071026; border:1px solid rgba(255,255,255,0.03); color:#e6eef6}
        .btn-generate{background:linear-gradient(90deg,#10b981,#06b6d4); border:0; color:#021018; font-weight:700}
        .btn-generate:active{transform:translateY(1px)}
        .btn-close{filter:brightness(1.6)}
        .thumbnail{max-width:320px; max-height:220px; border-radius:8px}
        .theme-toggle{background:transparent; border:1px solid rgba(255,255,255,0.04); color:var(--muted); padding:6px 10px; border-radius:8px}
        @media (max-width:720px){body{padding:14px}.container{padding:0}}
    .editor-preview {
    background: #020617;
    border-radius: 10px;
    padding: 12px;
    border: 1px solid rgba(255,255,255,0.06);
    }

    .preview-frame {
        position: relative;
        width: 30%;
        margin-left: 33%;
        aspect-ratio: 9 / 16;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
    }

    .preview-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
    }

    .preview-loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #9aa4b2;
        font-weight: 600;
        background: linear-gradient(
            90deg,
            #020617 25%,
            #050b1f 37%,
            #020617 63%
        );
        animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
        0% { background-position: -400px 0; }
        100% { background-position: 400px 0; }
    }

    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header d-flex align-items-center justify-content-between">
                <h1 class="card-title mb-0">Configurações para Geração de Vídeo</h1>
            </div>
            <div class="editor-preview mb-4">
                <div class="preview-frame">
                    <div id="previewLoading" class="preview-loading">
                        ▶ ...
                    </div>
                    <img id="previewImage" />
                </div>

                <div class="editor-controls">
                    <button type="button" class="btn btn-sm btn-outline-light" onclick="playPreview()">
                        ▶ Play
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Progresso</label>
                    <div class="progress" style="height:20px">
                        <div id="progressBar" class="progress-bar" role="progressbar" style="width:0%">0%</div>
                    </div>
                    <div id="progressMessage" class="mt-2 text-muted">pronto</div>
                </div>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                <form id="genForm" method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="channel" class="form-label">Canal</label>
                            <input type="text" class="form-control" id="channel" name="channel" value="parallelcuts" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label for="prompt_key" class="form-label">Prompt Key</label>
                                <div>
                                    <a href="/prompt_keys" class="small text-decoration-none text-info">Gerenciar Prompt Keys</a>
                                </div>
                            </div>
                            <select id="prompt_key" name="prompt_key" class="form-select">
                                <option value="">-- Nenhuma --</option>
                                {% for k in prompt_keys %}
                                <option value="{{ k.id }}">{{ k.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label for="template_select" class="form-label">Template</label>
                                <div>
                                    <a href="/templates" class="small text-decoration-none text-info">Gerenciar Templates</a>
                                </div>
                            </div>
                            <select id="template_select" name="template_select" class="form-select">
                                <option value="">-- Nenhum --</option>
                                {% for t in templates %}
                                <option value="{{ t.id }}">{{ t.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="prompt_ollama" class="form-label">Prompt Ollama</label>
                            <textarea class="form-control" id="prompt_ollama" name="prompt_ollama" rows="3" required>Escreva um texto inspirador e motivacional sobre fé cristã, esperança e superação, adequado para um vídeo curto no YouTube. Use uma linguagem envolvente e positiva que ressoe com o público, transmitindo uma mensagem de encorajamento e força espiritual.</textarea>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="prompt_positive" class="form-label">Prompt Positivo Comfy</label>
                            <textarea class="form-control" id="prompt_positive" name="prompt_positive" rows="3" required>ultra wide shot, cinematic lighting, epic composition, highly detailed, 8k, photorealistic, trending on artstation, sharp focus, dramatic lighting, intricate details, vibrant colors</textarea>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="prompt_negative" class="form-label">Prompt Negativo Comfy</label>
                            <textarea class="form-control" id="prompt_negative" name="prompt_negative" rows="3" required>lowres, bad anatomy, error body, error hands, error fingers, missing fingers, extra digit, fewer digits, cropped, worst quality, low quality, jpeg artifacts, ugly, blurry, distorted, deformed, disfigured, mutated, mutated hands and fingers</textarea>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="theme" class="form-label">Tema</label>
                            <input type="text" class="form-control" id="theme" name="theme" value="pregacao" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="voice_name" class="form-label">Nome da Voz</label>
                            <input type="text" class="form-control" id="voice_name" name="voice_name" value="pm_alex" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="voice_speed" class="form-label">Velocidade da Voz</label>
                            <input type="number" step="0.1" class="form-control" id="voice_speed" name="voice_speed" value="0.9" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="voice_pitch" class="form-label">Pitch da Voz</label>
                            <input type="number" step="0.01" class="form-control" id="voice_pitch" name="voice_pitch" value="0.90" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="voice_volume" class="form-label">Volume da Voz</label>
                            <input type="number" step="0.1" class="form-control" id="voice_volume" name="voice_volume" value="1.2" required>
                        </div>
                        <div class="col-md-4 mb-3 d-flex align-items-center">
                            <div>
                                <label class="form-label d-block">Efeito rádio</label>
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="voice_radio_effect" name="voice_radio_effect" checked>
                                    <label class="form-check-label" for="voice_radio_effect">Ativar</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="subtitle_words_per_line" class="form-label">Palavras por Linha de Legenda</label>
                            <input type="number" class="form-control" id="subtitle_words_per_line" name="subtitle_words_per_line" value="3" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="subtitle_font_size" class="form-label">Tamanho da Fonte da Legenda</label>
                            <input type="number" class="form-control" id="subtitle_font_size" name="subtitle_font_size" value="55" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="screen_orientation" class="form-label">Orientação da Tela</label>
                            <select class="form-select" id="screen_orientation" name="screen_orientation" required>
                                <option value="MOBILE" selected>MOBILE</option>
                                <option value="DESKTOP">DESKTOP</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="subtitle_font" class="form-label">Fonte da Legenda</label>
                            <input type="text" class="form-control" id="subtitle_font" name="subtitle_font" value="Lilita.ttf" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Cor da Fonte da Legenda (RGBA)</label>
                        <div class="row">
                            <div class="col-3">
                                <input type="number" class="form-control" name="subtitle_font_color_r" placeholder="R" value="255" min="0" max="255" required>
                            </div>
                            <div class="col-3">
                                <input type="number" class="form-control" name="subtitle_font_color_g" placeholder="G" value="191" min="0" max="255" required>
                            </div>
                            <div class="col-3">
                                <input type="number" class="form-control" name="subtitle_font_color_b" placeholder="B" value="0" min="0" max="255" required>
                            </div>
                            <div class="col-3">
                                <input type="number" class="form-control" name="subtitle_font_color_a" placeholder="A" value="200" min="0" max="255" required>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="force_text" class="form-label">Texto Forçado (opcional)</label>
                        <textarea class="form-control" id="force_text" name="force_text" rows="4"></textarea>
                    </div>
                    <button id="generateBtn" type="button" class="btn btn-generate btn-lg w-100">Gerar Vídeo</button>
                </form>
            </div>
        </div>
    </div>
    <script>
            // Load prompt key or template and populate form
            async function loadPromptKey(pkId) {
                if (!pkId) return;
                try {
                    const res = await fetch('/api/prompt_key/' + pkId);
                    if (!res.ok) return;
                    const j = await res.json();
                    document.getElementById('prompt_ollama').value = j.prompt_ollama || '';
                    document.getElementById('prompt_positive').value = j.prompt_positive || '';
                    document.getElementById('prompt_negative').value = j.prompt_negative || '';
                } catch (e) { console.error(e); }
            }

            async function loadTemplate(tid) {
                if (!tid) return;
                try {
                    const res = await fetch('/api/template/' + tid);
                    if (!res.ok) return;
                    const j = await res.json();
                    const data = j.data || {};
                    if (data.prompt_ollama) document.getElementById('prompt_ollama').value = data.prompt_ollama;
                    if (data.prompt_positive) document.getElementById('prompt_positive').value = data.prompt_positive;
                    if (data.prompt_negative) document.getElementById('prompt_negative').value = data.prompt_negative;
                    if (data.channel) document.getElementById('channel').value = data.channel;
                    if (data.theme) document.getElementById('theme').value = data.theme;
                    if (data.voice_name) document.getElementById('voice_name').value = data.voice_name;
                    if (data.voice_speed) document.getElementById('voice_speed').value = data.voice_speed;
                } catch (e) { console.error(e); }
            }

            document.getElementById('prompt_key')?.addEventListener('change', (e) => {
                const v = e.target.value;
                if (!v) return;
                loadPromptKey(v);
            });

            document.getElementById('template_select')?.addEventListener('change', (e) => {
                const v = e.target.value;
                if (!v) return;
                loadTemplate(v);
            });

            // Poll /status e atualiza a barra de progresso
            function pollStatus() {
                fetch('/status')
                    .then(r => r.json())
                    .then(data => {
                        const p = Math.max(0, Math.min(100, Number(data.progress || 0)));
                        const bar = document.getElementById('progressBar');
                        const msg = document.getElementById('progressMessage');
                        bar.style.width = p + '%';
                        bar.textContent = p + '%';
                        msg.textContent = data.message || '';

                        // if finished or canceled, reset button
                        const genBtn = document.getElementById('generateBtn');
                        if (p === 0 || p >= 95 || (data.message || '').toLowerCase().includes('cancel')) {
                            genBtn.textContent = 'Gerar Vídeo';
                            genBtn.dataset.running = 'false';
                        }
                    })
                    .catch(() => {});
            }

            setInterval(pollStatus, 2000);
            pollStatus();

            // Handle generate/stop toggle
            const genForm = document.getElementById('genForm');
            const genBtn = document.getElementById('generateBtn');
            genBtn.dataset.running = 'false';

            genBtn.addEventListener('click', (e) => {
                const running = genBtn.dataset.running === 'true';
                if (!running) {
                    // start generation via fetch
                    const form = genForm;
                    const formData = new FormData(form);
                    fetch('/generate', { method: 'POST', body: formData })
                        .then(() => {
                            genBtn.textContent = 'Interromper Geração';
                            genBtn.dataset.running = 'true';
                        })
                        .catch(err => {
                            console.error(err);
                            alert('Falha ao iniciar geração');
                        });
                } else {
                    // send stop
                    fetch('/stop', { method: 'POST' })
                        .then(r => r.json())
                        .then(j => {
                            if (j.stopped) {
                                genBtn.textContent = 'Gerar Vídeo';
                                genBtn.dataset.running = 'false';
                            } else {
                                alert('Não existe geração ativa');
                            }
                        });
                }
            });

        const themeToggle = document.getElementById('themeToggle');
        const root = document.documentElement;
        function playPreview() {
            const img = document.getElementById("previewImage");
            const loading = document.getElementById("previewLoading");

            img.style.display = "none";
            loading.style.display = "flex";

            const form = document.querySelector("form");
            const formData = new FormData(form);

            fetch("/preview", {
                method: "POST",
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                img.src = data.preview + "?t=" + Date.now(); // cache bust
                img.onload = () => {
                    loading.style.display = "none";
                    img.style.display = "block";
                };
            })
            .catch(err => {
                loading.innerText = "Erro ao gerar preview";
                console.error(err);
            });
        }
        themeToggle?.addEventListener('click', ()=>{
            const cur = localStorage.getItem('vf-theme') === 'light';
            setLightMode(!cur);
        });
        if(localStorage.getItem('vf-theme') === 'light') setLightMode(true);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
