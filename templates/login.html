<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Entrar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center">
  <div class="w-full max-w-md bg-slate-800 rounded-lg p-6 shadow-lg">
    <div class="flex items-center gap-3 mb-4">
      <!-- Icon -->
      <svg class="w-10 h-10 text-emerald-400" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 20v-1a4 4 0 014-4h8a4 4 0 014 4v1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1 class="text-xl font-semibold">Entrar</h1>
    </div>
    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label class="block text-sm text-slate-300">E-mail</label>
        <input name="email" type="email" required class="mt-1 w-full rounded bg-slate-700 p-2 text-slate-100" />
      </div>
      <div>
        <label class="block text-sm text-slate-300">Senha</label>
        <div class="relative mt-1">
          <input id="login_password" name="password" type="password" required class="w-full rounded bg-slate-700 p-2 pr-10 text-slate-100" />
          <button type="button" id="toggleLoginPassword" class="absolute inset-y-0 right-2 flex items-center px-2 text-slate-300" aria-label="Mostrar senha"></button>
        </div>
      </div>
      <button class="w-full py-2 rounded bg-emerald-400 text-slate-900 font-semibold">Entrar</button>
    </form>
    <p class="mt-4 text-sm text-slate-400">Não tem conta? <a href="/register" class="text-emerald-300">Registre-se</a></p>
  </div>
  {% include '_modal.html' %}

  <script>
    (function(){
      const eye = '<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>';
      const eyeOff = '<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.995 9.995 0 012.696-4.042M3 3l18 18"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.88 9.88A3 3 0 0114.12 14.12"/></svg>';

      const pwd = document.getElementById('login_password');
      const btn = document.getElementById('toggleLoginPassword');
      function setIcon(button, visible){ if(!button) return; button.innerHTML = visible ? eyeOff : eye; }
      if(btn && pwd){
        btn.addEventListener('click', ()=>{
          const show = pwd.type === 'password';
          pwd.type = show ? 'text' : 'password';
          setIcon(btn, show);
        });
        setIcon(btn, false);
      }
    })();
  </script>
</body>
</html>
