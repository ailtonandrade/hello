<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Redefinir Senha</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center">
  <div class="w-full max-w-md bg-slate-800 rounded-lg p-6 shadow-lg">
    <div class="flex items-center gap-3 mb-4">
      <svg class="w-10 h-10 text-emerald-400" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1 class="text-xl font-semibold text-emerald-400">Redefinir Senha</h1>
    </div>
    <p class="text-slate-300 mb-4">Informe o e-mail associado à sua conta. Enviaremos um código de 5 dígitos para redefinir sua senha.</p>
    <form method="POST" action="/forgot-password" class="space-y-4">
      <div>
        <label class="block text-sm text-slate-300">E-mail</label>
        <input name="email" type="email" required class="mt-1 w-full rounded bg-slate-700 p-2 text-slate-100" />
      </div>
      <button class="w-full py-2 rounded bg-emerald-400 text-slate-900 font-semibold">Enviar Código</button>
    </form>
    <p class="mt-4 text-sm text-slate-400"><a href="/login" class="text-emerald-300">Voltar ao login</a></p>
  </div>
  {% include 'partials/_modal.html' %}
  {% if flash_message %}
    <div id="flash-data" class="hidden">{{ flash_message | tojson }}</div>
  {% endif %}

  <script>
    // show modal on server-side flash payload and optionally redirect on close
    try{
      const fm = document.getElementById('flash-data');
      if(fm){
        const data = JSON.parse(fm.textContent || '{}');
        if(data && data.message){
          // if the modal should redirect when closed, wrap hideModal
          if(data.redirect_on_close){
            const originalHide = window.hideModal || function(){};
            window.hideModal = function(){
              try{ originalHide(); }catch(e){}
              try{ window.location.href = data.redirect_on_close; }catch(e){}
            }
          }
          showModal(data.title||'Mensagem', data.message, data.icon||'ℹ️');
        }
      }
    }catch(e){/* ignore */}
  </script>
</body>
</html>
